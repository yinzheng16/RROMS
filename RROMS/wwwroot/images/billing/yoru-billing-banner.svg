<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMaxYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- YORU IZAKAYA — US32 billing banner (original artwork, Member 4) -->
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#FBF4E8"/>
      <stop offset=".55" stop-color="#F6EADA"/>
      <stop offset="1" stop-color="#EFDFC8"/>
    </linearGradient>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 .35  0 0 0 0 .24  0 0 0 0 .16  0 0 0 .06 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="wash" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
    <radialGradient id="moon" cx=".45" cy=".4" r=".6">
      <stop offset="0" stop-color="#FFF7E6"/>
      <stop offset=".75" stop-color="#F3DDB4"/>
      <stop offset="1" stop-color="#E9C994"/>
    </radialGradient>
    <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A3D2E" stop-opacity=".55"/>
      <stop offset="1" stop-color="#5A3D2E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hillB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A3D2E" stop-opacity=".28"/>
      <stop offset="1" stop-color="#5A3D2E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6B4632"/>
      <stop offset="1" stop-color="#3E2A20"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#FBF4E8"/>
      <stop offset=".38" stop-color="#FBF4E8" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#FBF4E8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="waves" width="40" height="20" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#B79B72" stroke-width="1.2">
        <circle cx="20" cy="20" r="18"/><circle cx="20" cy="20" r="12"/><circle cx="20" cy="20" r="6"/>
        <circle cx="0" cy="10" r="18"/><circle cx="40" cy="10" r="18"/>
      </g>
    </pattern>
    <g id="ume">
      <g fill="#D9574A">
        <circle cx="0" cy="-7" r="6"/><circle cx="6.7" cy="-2.2" r="6"/><circle cx="4.1" cy="5.7" r="6"/>
        <circle cx="-4.1" cy="5.7" r="6"/><circle cx="-6.7" cy="-2.2" r="6"/>
      </g>
      <circle r="3.2" fill="#F7D9A8"/>
      <g stroke="#8A2E22" stroke-width="1" stroke-linecap="round">
        <path d="M0 0 0-4M0 0 3.6-1.2M0 0 2.2 3.2M0 0-2.2 3.2M0 0-3.6-1.2"/>
      </g>
    </g>
    <g id="bud"><ellipse rx="3.6" ry="4.6" fill="#C8453A"/></g>
  </defs>

  <!-- washi ground -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="#000" filter="url(#paper)"/>

  <!-- moon + glow -->
  <circle cx="905" cy="150" r="120" fill="#F3D9A6" opacity=".55" filter="url(#soft)"/>
  <circle cx="905" cy="150" r="96" fill="url(#moon)"/>

  <!-- ink-wash hills (rolling, not a single peak) -->
  <path d="M520 300 C600 250 650 262 720 232 C790 204 840 236 900 214 C980 186 1050 230 1120 206 C1160 194 1185 200 1200 196 V400 H520Z" fill="url(#hillB)" filter="url(#wash)"/>
  <path d="M600 330 C670 292 720 300 780 276 C850 250 900 286 960 268 C1030 248 1090 276 1200 252 V400 H600Z" fill="url(#hillA)" filter="url(#wash)"/>
  <!-- mist bands -->
  <rect x="560" y="286" width="640" height="16" rx="8" fill="#FBF4E8" opacity=".45" filter="url(#wash)"/>
  <rect x="640" y="318" width="560" height="12" rx="6" fill="#FBF4E8" opacity=".35" filter="url(#wash)"/>

  <!-- distant birds -->
  <g fill="none" stroke="#5A3D2E" stroke-width="2" stroke-linecap="round" opacity=".55">
    <path d="M760 120 q8-7 15 0 q7-7 15 0"/>
    <path d="M800 96 q6-5 11 0 q5-5 11 0"/>
  </g>

  <!-- counter -->
  <rect x="560" y="352" width="640" height="48" fill="url(#wood)"/>
  <rect x="560" y="352" width="640" height="5" fill="#8A5E42"/>
  <defs><linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#F8EEDF"/><stop offset="1" stop-color="#F8EEDF" stop-opacity="0"/></linearGradient></defs>
  <rect x="556" y="352" width="220" height="48" fill="url(#edge)"/>

  <!-- soroban (abacus) on the counter -->
  <g transform="translate(760 300) rotate(-4)">
    <rect x="0" y="0" width="250" height="66" rx="6" fill="#3E2A20"/>
    <rect x="8" y="8" width="234" height="50" rx="3" fill="#F3E4CC"/>
    <rect x="8" y="22" width="234" height="4" fill="#3E2A20"/>
    <g stroke="#9A7440" stroke-width="2">
      <path d="M26 8v50M50 8v50M74 8v50M98 8v50M122 8v50M146 8v50M170 8v50M194 8v50M218 8v50"/>
    </g>
    <g fill="#5A3D2E">
      <!-- top beads -->
      <ellipse cx="26" cy="13" rx="8.5" ry="3.6"/><ellipse cx="50" cy="18" rx="8.5" ry="3.6"/>
      <ellipse cx="74" cy="13" rx="8.5" ry="3.6"/><ellipse cx="98" cy="13" rx="8.5" ry="3.6"/>
      <ellipse cx="122" cy="18" rx="8.5" ry="3.6"/><ellipse cx="146" cy="13" rx="8.5" ry="3.6"/>
      <ellipse cx="170" cy="13" rx="8.5" ry="3.6"/><ellipse cx="194" cy="18" rx="8.5" ry="3.6"/>
      <ellipse cx="218" cy="13" rx="8.5" ry="3.6"/>
      <!-- bottom beads: 4 per rod -->
      <defs><g id="col">
        <ellipse cx="0" cy="31" rx="8.5" ry="3.6"/><ellipse cx="0" cy="38.5" rx="8.5" ry="3.6"/>
        <ellipse cx="0" cy="47" rx="8.5" ry="3.6"/><ellipse cx="0" cy="54.5" rx="8.5" ry="3.6"/>
      </g></defs>
    </g>
    <g fill="#5A3D2E">
      <use href="#col" x="26"/><use href="#col" x="74"/><use href="#col" x="98"/>
      <use href="#col" x="146"/><use href="#col" x="170"/><use href="#col" x="218"/>
    </g>
    <g fill="#C83E2D">
      <use href="#col" x="50"/><use href="#col" x="122"/><use href="#col" x="194"/>
    </g>
  </g>

  <!-- folded bill slip with red seal -->
  <g transform="translate(1050 318) rotate(6)">
    <rect width="70" height="38" rx="2" fill="#FFFBF2" stroke="#D9C6A6"/>
    <path d="M10 10h38M10 18h30M10 26h22" stroke="#B79B72" stroke-width="2" stroke-linecap="round"/>
    <rect x="48" y="20" width="14" height="14" rx="2" fill="#C83E2D"/>
  </g>

  <!-- ume (plum) branch from the top right -->
  <g fill="none" stroke="#3E2A20" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1210 18 C1150 40 1110 34 1060 66 C1020 92 990 96 950 98" stroke-width="9"/>
    <path d="M1060 66 C1046 96 1050 120 1034 146" stroke-width="5"/>
    <path d="M1000 94 C984 76 968 70 944 64" stroke-width="4"/>
    <path d="M1130 38 C1128 62 1140 78 1136 102" stroke-width="4"/>
    <path d="M950 98 C930 104 916 118 902 120" stroke-width="3"/>
  </g>
  <use href="#ume" x="1034" y="146"/><use href="#ume" x="944" y="64"/>
  <use href="#ume" x="1088" y="52"/><use href="#ume" x="1136" y="102"/>
  <use href="#ume" x="990" y="104" transform="rotate(20 990 104)"/>
  <use href="#ume" x="1046" y="112" transform="scale(.8) translate(261 28)"/>
  <use href="#bud" x="902" y="120"/><use href="#bud" x="1160" y="44"/><use href="#bud" x="968" y="72"/>
  <!-- falling petals -->
  <g fill="#D9574A" opacity=".75">
    <ellipse cx="860" cy="210" rx="5" ry="3" transform="rotate(30 860 210)"/>
    <ellipse cx="1000" cy="230" rx="4" ry="2.6" transform="rotate(-20 1000 230)"/>
    <ellipse cx="720" cy="170" rx="4" ry="2.6" transform="rotate(50 720 170)"/>
  </g>

  <!-- gold waves, bottom left corner -->

  <!-- keep the left side calm for the text -->
  <rect width="1200" height="400" fill="url(#fade)"/>
</svg>
