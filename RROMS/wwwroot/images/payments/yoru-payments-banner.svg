<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- YORU IZAKAYA - US34 My Payments banner (Member 4). Original artwork in the Cart banner style:
       red moon, ink mountains, lacquer tray with a stamped receipt and coins, sakura branch.
       The left edge fades out so the washi background of the page shows through. -->
  <defs>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0" />
      <stop offset=".28" stop-color="#fff" stop-opacity="1" />
    </linearGradient>
    <mask id="m"><rect width="900" height="260" fill="url(#fade)" /></mask>
    <linearGradient id="mt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4844" />
      <stop offset="1" stop-color="#4a4844" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="moon">
      <stop offset="0" stop-color="#e2553f" />
      <stop offset=".85" stop-color="#c83e2d" />
      <stop offset="1" stop-color="#c83e2d" stop-opacity=".2" />
    </radialGradient>
    <linearGradient id="tray" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3a1712" />
      <stop offset="1" stop-color="#1c0b09" />
    </linearGradient>
    <g id="fl">
      <g fill="#f4a6a0">
        <circle cx="0" cy="-4" r="3.6" /><circle cx="3.8" cy="-1.2" r="3.6" /><circle cx="2.4" cy="3.3" r="3.6" />
        <circle cx="-2.4" cy="3.3" r="3.6" /><circle cx="-3.8" cy="-1.2" r="3.6" />
      </g>
      <circle r="1.6" fill="#c83e2d" />
    </g>
  </defs>

  <g mask="url(#m)">
    <circle cx="520" cy="86" r="50" fill="url(#moon)" opacity=".9" />
    <path d="M230 260 L330 150 L380 176 L455 112 L530 190 L580 162 L660 260Z" fill="url(#mt)" opacity=".55" />
    <path d="M340 260 L440 178 L490 204 L580 150 L700 260Z" fill="url(#mt)" opacity=".75" />
    <g fill="#f4a6a0" opacity=".85">
      <ellipse cx="640" cy="118" rx="3.4" ry="2.2" transform="rotate(30 640 118)" />
      <ellipse cx="590" cy="52" rx="3" ry="2" />
      <ellipse cx="430" cy="96" rx="2.8" ry="1.9" transform="rotate(-20 430 96)" />
      <ellipse cx="360" cy="44" rx="2.6" ry="1.7" />
    </g>
  </g>

  <!-- lacquer tray with a stamped receipt and two coins -->
  <g transform="translate(630 150)">
    <ellipse cx="60" cy="66" rx="128" ry="22" fill="#000" opacity=".16" />
    <path d="M-56 34 Q60 80 176 34 L167 54 Q60 96 -47 54Z" fill="url(#tray)" />
    <ellipse cx="60" cy="34" rx="122" ry="30" fill="#6d1d14" />
    <ellipse cx="60" cy="34" rx="111" ry="24" fill="#2a100c" />
    <path d="M-5 34 Q60 52 125 34" stroke="#B79B72" stroke-width="1.3" fill="none" opacity=".7" />
    <g transform="rotate(-8 40 10)">
      <rect x="6" y="-16" width="82" height="44" rx="2" fill="#fffaf0" stroke="#d9c7a3" />
      <path d="M15 -5h46M15 3h56M15 11h34" stroke="#b8a888" stroke-width="2.2" />
      <rect x="64" y="10" width="16" height="14" fill="none" stroke="#c83e2d" stroke-width="1.8" />
      <text x="72" y="21.5" font-size="10.5" text-anchor="middle" fill="#c83e2d" font-family="serif">済</text>
    </g>
    <ellipse cx="118" cy="29" rx="17" ry="7" fill="#a8803e" />
    <ellipse cx="118" cy="26" rx="17" ry="7" fill="#d6ad67" />
    <ellipse cx="118" cy="26" rx="5.5" ry="2.2" fill="#2a100c" />
    <ellipse cx="140" cy="38" rx="15" ry="6" fill="#a8803e" />
    <ellipse cx="140" cy="35" rx="15" ry="6" fill="#e4c07a" />
    <ellipse cx="140" cy="35" rx="4.6" ry="1.8" fill="#2a100c" />
  </g>

  <!-- sakura branch from the top right -->
  <path d="M900 10 C820 24 770 36 712 70 M780 40 C756 26 738 24 714 26 M826 26 C814 52 802 66 778 78"
        stroke="#3a2a22" stroke-width="3.4" fill="none" stroke-linecap="round" />
  <use href="#fl" transform="translate(714 70) scale(1.4)" />
  <use href="#fl" transform="translate(744 52) scale(1.05)" />
  <use href="#fl" transform="translate(716 26) scale(1.2)" />
  <use href="#fl" transform="translate(780 78) scale(1.3)" />
  <use href="#fl" transform="translate(806 34) scale(1.5)" />
  <use href="#fl" transform="translate(852 18) scale(1.1)" />
  <use href="#fl" transform="translate(872 40) scale(1.3)" />
</svg>
